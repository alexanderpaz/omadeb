# Atajos de Omarchy (tiling-v2, utilities, media, clipboard) en sintaxis hyprlang.
# bindd = MODS, TECLA, descripción, dispatcher, args  → la descripción aparece en SUPER+K

$mod = SUPER

# --- Ventanas -----------------------------------------------------------------
bindd = $mod, W, Cerrar ventana, killactive,
bindd = $mod, J, Alternar división, togglesplit,
bindd = $mod, P, Pseudo-tile, pseudo,
bindd = $mod, T, Alternar flotante/tiling, togglefloating,
bindd = $mod, F, Pantalla completa, fullscreen, 0
bindd = $mod CTRL, F, Pantalla completa en mosaico, fullscreenstate, 0 2
bindd = $mod ALT, F, Ancho completo, fullscreen, 1
bindd = $mod, O, Sacar ventana (flotar y fijar), exec, hyprctl --batch "dispatch togglefloating; dispatch pin"

bindd = $mod, LEFT, Foco a la izquierda, movefocus, l
bindd = $mod, RIGHT, Foco a la derecha, movefocus, r
bindd = $mod, UP, Foco arriba, movefocus, u
bindd = $mod, DOWN, Foco abajo, movefocus, d

bindd = $mod SHIFT, LEFT, Intercambiar a la izquierda, swapwindow, l
bindd = $mod SHIFT, RIGHT, Intercambiar a la derecha, swapwindow, r
bindd = $mod SHIFT, UP, Intercambiar arriba, swapwindow, u
bindd = $mod SHIFT, DOWN, Intercambiar abajo, swapwindow, d

bindd = ALT, TAB, Siguiente ventana, cyclenext,
bindd = ALT SHIFT, TAB, Ventana anterior, cyclenext, prev
bindd = ALT, TAB, Traer ventana al frente, bringactivetotop,
bindd = ALT SHIFT, TAB, Traer ventana al frente, bringactivetotop,

# Redimensionar con - y = (code:20 / code:21)
bindd = $mod, code:20, Ensanchar a la izquierda, resizeactive, -100 0
bindd = $mod, code:21, Encoger a la izquierda, resizeactive, 100 0
bindd = $mod SHIFT, code:20, Encoger hacia arriba, resizeactive, 0 -100
bindd = $mod SHIFT, code:21, Agrandar hacia abajo, resizeactive, 0 100

bindmd = $mod, mouse:272, Mover ventana, movewindow
bindmd = $mod, mouse:273, Redimensionar ventana, resizewindow

# --- Espacios de trabajo ------------------------------------------------------
bindd = $mod, code:10, Ir al espacio 1, workspace, 1
bindd = $mod, code:11, Ir al espacio 2, workspace, 2
bindd = $mod, code:12, Ir al espacio 3, workspace, 3
bindd = $mod, code:13, Ir al espacio 4, workspace, 4
bindd = $mod, code:14, Ir al espacio 5, workspace, 5
bindd = $mod, code:15, Ir al espacio 6, workspace, 6
bindd = $mod, code:16, Ir al espacio 7, workspace, 7
bindd = $mod, code:17, Ir al espacio 8, workspace, 8
bindd = $mod, code:18, Ir al espacio 9, workspace, 9
bindd = $mod, code:19, Ir al espacio 10, workspace, 10

bindd = $mod SHIFT, code:10, Mover ventana al espacio 1, movetoworkspace, 1
bindd = $mod SHIFT, code:11, Mover ventana al espacio 2, movetoworkspace, 2
bindd = $mod SHIFT, code:12, Mover ventana al espacio 3, movetoworkspace, 3
bindd = $mod SHIFT, code:13, Mover ventana al espacio 4, movetoworkspace, 4
bindd = $mod SHIFT, code:14, Mover ventana al espacio 5, movetoworkspace, 5
bindd = $mod SHIFT, code:15, Mover ventana al espacio 6, movetoworkspace, 6
bindd = $mod SHIFT, code:16, Mover ventana al espacio 7, movetoworkspace, 7
bindd = $mod SHIFT, code:17, Mover ventana al espacio 8, movetoworkspace, 8
bindd = $mod SHIFT, code:18, Mover ventana al espacio 9, movetoworkspace, 9
bindd = $mod SHIFT, code:19, Mover ventana al espacio 10, movetoworkspace, 10

bindd = $mod SHIFT ALT, code:10, Mover en silencio al espacio 1, movetoworkspacesilent, 1
bindd = $mod SHIFT ALT, code:11, Mover en silencio al espacio 2, movetoworkspacesilent, 2
bindd = $mod SHIFT ALT, code:12, Mover en silencio al espacio 3, movetoworkspacesilent, 3
bindd = $mod SHIFT ALT, code:13, Mover en silencio al espacio 4, movetoworkspacesilent, 4
bindd = $mod SHIFT ALT, code:14, Mover en silencio al espacio 5, movetoworkspacesilent, 5

bindd = $mod, S, Scratchpad, togglespecialworkspace, scratchpad
bindd = $mod ALT, S, Enviar al scratchpad, movetoworkspacesilent, special:scratchpad
bindd = $mod, TAB, Espacio siguiente, workspace, e+1
bindd = $mod SHIFT, TAB, Espacio anterior, workspace, e-1
bindd = $mod CTRL, TAB, Espacio previo, workspace, previous
bindd = $mod, mouse_down, Espacio siguiente, workspace, e+1
bindd = $mod, mouse_up, Espacio anterior, workspace, e-1

# --- Grupos -------------------------------------------------------------------
bindd = $mod, G, Alternar grupo, togglegroup,
bindd = $mod ALT, G, Sacar del grupo, moveoutofgroup,
bindd = $mod ALT, LEFT, Unir al grupo de la izquierda, moveintogroup, l
bindd = $mod ALT, RIGHT, Unir al grupo de la derecha, moveintogroup, r
bindd = $mod ALT, UP, Unir al grupo de arriba, moveintogroup, u
bindd = $mod ALT, DOWN, Unir al grupo de abajo, moveintogroup, d
bindd = $mod ALT, TAB, Siguiente en el grupo, changegroupactive, f
bindd = $mod ALT SHIFT, TAB, Anterior en el grupo, changegroupactive, b

# --- Aplicaciones -------------------------------------------------------------
bindd = $mod, RETURN, Terminal, exec, alacritty
bindd = $mod SHIFT, RETURN, Navegador, exec, x-www-browser
bindd = $mod SHIFT, F, Archivos, exec, thunar
bindd = $mod SHIFT, N, Editor, exec, alacritty -e nvim
bindd = $mod CTRL, T, Monitor del sistema, exec, alacritty --class omadeb-floating -e btop

# --- Menús (fuzzel ocupa el lugar de walker) ----------------------------------
bindd = $mod, SPACE, Lanzar aplicaciones, exec, pkill fuzzel || fuzzel
bindd = $mod ALT, SPACE, Menú omadeb, exec, omadeb-menu
bindd = $mod, ESCAPE, Menú de sistema, exec, omadeb-menu system
bindd = , XF86PowerOff, Menú de energía, exec, omadeb-menu system
bindd = $mod, K, Mostrar atajos, exec, omadeb-keybindings
bindd = $mod SHIFT CTRL, SPACE, Elegir tema, exec, omadeb-menu theme
bindd = $mod CTRL, SPACE, Siguiente fondo, exec, omadeb-bg-next
bindd = $mod CTRL, V, Historial del portapapeles, exec, omadeb-menu clipboard
bindd = $mod SHIFT, SPACE, Mostrar/ocultar la barra, exec, pkill -SIGUSR1 waybar
bindd = $mod CTRL, L, Bloquear, exec, loginctl lock-session

# --- Notificaciones -----------------------------------------------------------
bindd = $mod, COMMA, Descartar notificación, exec, makoctl dismiss
bindd = $mod SHIFT, COMMA, Descartar todas, exec, makoctl dismiss --all
bindd = $mod CTRL, COMMA, No molestar, exec, omadeb-toggle-dnd
bindd = $mod ALT, COMMA, Abrir la última, exec, makoctl invoke
bindd = $mod SHIFT ALT, COMMA, Recuperar la última, exec, makoctl restore

# --- Capturas -----------------------------------------------------------------
bindd = , PRINT, Captura de región, exec, omadeb-screenshot region
bindd = SHIFT, PRINT, Captura de pantalla completa, exec, omadeb-screenshot output
bindd = CTRL, PRINT, Captura y editar, exec, omadeb-screenshot edit
bindd = $mod, PRINT, Selector de color, exec, pkill hyprpicker || hyprpicker -a

# --- Multimedia (funcionan con la pantalla bloqueada) -------------------------
bindeld = , XF86AudioRaiseVolume, Subir volumen, exec, swayosd-client --output-volume raise
bindeld = , XF86AudioLowerVolume, Bajar volumen, exec, swayosd-client --output-volume lower
bindeld = ALT, XF86AudioRaiseVolume, Subir volumen (fino), exec, swayosd-client --output-volume +1
bindeld = ALT, XF86AudioLowerVolume, Bajar volumen (fino), exec, swayosd-client --output-volume -1
bindld = , XF86AudioMute, Silenciar, exec, swayosd-client --output-volume mute-toggle
bindld = , XF86AudioMicMute, Silenciar micrófono, exec, swayosd-client --input-volume mute-toggle
bindeld = , XF86MonBrightnessUp, Subir brillo, exec, swayosd-client --brightness raise
bindeld = , XF86MonBrightnessDown, Bajar brillo, exec, swayosd-client --brightness lower
bindld = , XF86AudioNext, Siguiente pista, exec, swayosd-client --playerctl next
bindld = , XF86AudioPrev, Pista anterior, exec, swayosd-client --playerctl previous
bindld = , XF86AudioPlay, Reproducir/pausar, exec, swayosd-client --playerctl play-pause
bindld = , XF86AudioPause, Reproducir/pausar, exec, swayosd-client --playerctl play-pause
