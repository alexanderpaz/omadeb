# Reglas de ventanas (sintaxis de Hyprland 0.52: windowrule = regla, coincidencia)

windowrule = suppressevent maximize, class:.*
windowrule = nofocus, class:^$, title:^$, xwayland:1, floating:1, fullscreen:0, pinned:0

# Una pizca de transparencia como en Omarchy; las apps de vídeo e imagen quedan opacas.
windowrule = opacity 0.97 0.9, class:.*
windowrule = opacity 1 1, class:^(mpv|imv|vlc|org.gnome.Loupe|firefox-esr|firefox|chromium|google-chrome)$
windowrule = opacity 1 1, title:.*YouTube.*

# Utilidades flotantes y centradas
windowrule = float, class:^(org.pulseaudio.pavucontrol|pavucontrol|blueman-manager|nm-connection-editor|org.gnome.Calculator|swappy|xdg-desktop-portal-gtk)$
windowrule = size 875 600, class:^(org.pulseaudio.pavucontrol|pavucontrol|blueman-manager|nm-connection-editor)$
windowrule = center, class:^(org.pulseaudio.pavucontrol|pavucontrol|blueman-manager|nm-connection-editor)$
windowrule = float, title:^(Open File|Save File|Open Folder|Choose Files|File Upload).*$
windowrule = float, class:^(omadeb-floating)$
windowrule = size 1000 640, class:^(omadeb-floating)$
windowrule = center, class:^(omadeb-floating)$
windowrule = float, class:^(polkit-mate-authentication-agent-1)$
windowrule = pin, class:^(polkit-mate-authentication-agent-1)$

# Picture-in-picture
windowrule = float, title:^(Picture-in-Picture|Picture in picture)$
windowrule = pin, title:^(Picture-in-Picture|Picture in picture)$
windowrule = size 600 338, title:^(Picture-in-Picture|Picture in picture)$
windowrule = move 100%-620 100%-358, title:^(Picture-in-Picture|Picture in picture)$

# Capas: desenfoque detrás del lanzador, notificaciones y OSD
layerrule = blur, launcher
layerrule = ignorezero, launcher
layerrule = noanim, selection
layerrule = blur, notifications
layerrule = ignorezero, notifications
layerrule = blur, swayosd
layerrule = ignorezero, swayosd
