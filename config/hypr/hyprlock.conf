source = ~/.config/omadeb/current/theme/hyprlock.conf

general {
    ignore_empty_input = true
}

background {
    monitor =
    color = $color
    path = ~/.config/omadeb/current/background
    blur_passes = 3
    blur_size = 6
    brightness = 0.6
}

animations {
    enabled = false
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = $font_color
    font_size = 160
    font_family = JetBrainsMono Nerd Font ExtraBold
    position = 0, 220
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A, %d de %B')"
    color = $font_color
    font_size = 22
    font_family = JetBrainsMono Nerd Font
    position = 0, 100
    halign = center
    valign = center
}

label {
    monitor =
    text =   $USER
    color = $check_color
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 0, -30
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 52
    position = 0, -100
    halign = center
    valign = center

    inner_color = $inner_color
    outer_color = $outer_color
    check_color = $check_color
    font_color = $font_color
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.4
    dots_center = true
    rounding = -1
    shadow_passes = 0
    fade_on_empty = true
    fade_timeout = 3000

    font_family = JetBrainsMono Nerd Font
    placeholder_text = <i>󰌾  Escribe tu contraseña</i>
    fail_text = <i>$FAIL ($ATTEMPTS)</i>
}

label {
    monitor =
    text = $FPRINTPROMPT
    color = $font_color
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    position = 0, -170
    halign = center
    valign = center
}

auth {
    fingerprint:enabled = true
}
