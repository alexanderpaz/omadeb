# omadeb — Hyprland al estilo Omarchy en Debian
# https://wiki.hypr.land/Configuring/

# Valores de omadeb (no editar; se actualizan con el proyecto)
source = ~/.local/share/omadeb/default/hypr/omadeb.conf

# Tema actual (lo genera omadeb-theme-set)
source = ~/.config/omadeb/current/theme/hyprland.conf

# Tus ajustes: sobrescriben todo lo anterior
source = ~/.config/hypr/monitors.conf
source = ~/.config/hypr/input.conf
source = ~/.config/hypr/looknfeel.conf
source = ~/.config/hypr/bindings.conf
source = ~/.config/hypr/autostart.conf
